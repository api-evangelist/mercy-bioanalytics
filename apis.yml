aid: mercy-bioanalytics
name: Mercy BioAnalytics
description: >-
  Mercy BioAnalytics, Inc. is a Waltham, Massachusetts clinical-stage cancer diagnostics
  company, founded in 2018, developing extracellular-vesicle (EV) based liquid biopsy tests
  for the early detection of cancer. Its patented Mercy Halo platform uses biomarker
  co-localization — the simultaneous detection of multiple cancer-related biomarkers on the
  surface of individual tumor-derived extracellular vesicles — to read a small volume of
  serum or plasma with a simple PCR-based readout. The company's initial programs target
  ovarian cancer screening in asymptomatic post-menopausal women and lung cancer detection in
  average and high-risk individuals; the Mercy Halo Ovarian Cancer Screening Test received
  FDA Breakthrough Device Designation in May 2024. Mercy BioAnalytics raised a $41M Series A
  in April 2023 led by Novalis LifeSciences and a $59M Series B in September 2025. The product
  is a laboratory-developed blood test, not software: as of this profile the company publishes
  no public developer program, API, SDK, or machine-readable API contract of any kind.
